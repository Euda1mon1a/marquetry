[project]
name = "marquetry-svg"
dynamic = ["version"]
description = "Turn a flat logo image into filament-ready multi-color SVGs for 3D printing: one path per color, plus a base disc."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Montgomery" }]
keywords = ["3d printing", "svg", "vectorize", "multi-color", "bambu", "coaster", "vtracer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Printing",
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "numpy>=2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "vtracer>=0.6.11",
    # the drag-and-drop app, and the SVG preview renderer (QtSvg)
    "pyqt6>=6.7",
]

[project.urls]
Homepage = "https://github.com/Euda1mon1a/marquetry"
Issues = "https://github.com/Euda1mon1a/marquetry/issues"

[project.scripts]
marquetry = "marquetry_svg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/marquetry_svg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/marquetry_svg"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
